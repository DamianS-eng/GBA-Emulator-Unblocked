name: List Binaries in Directory

on:
  push

jobs:
  list-files:
    runs-on: ubuntu-latest
    env:
      DIR: ./Binaries
      OUTFILE: binary_list.txt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Count and list files
        run: |
          COUNT=$(find "$DIR" -type f -name "*.gba" | wc -l)
          echo "There are $COUNT binaries found.
          find "$DIR" -type f -name "*.gba" > $OUTFILE
          echo "List written to $OUTFILE"
      - name: Commit and push file list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$OUTFILE"
          git commit -m "Update $OUTFILE" || echo "No changes to commit"
          git push
