<!DOCTYPE html>
<html lang="en-us">
    <head>
        <link rel="shortcut icon" href="./Binaries/gb.ico">
        <link rel="stylesheet" href="./user_css/home.css">
        <title>Game Boy Advance</title>
        <meta charset="UTF-8">
        <meta name="color-scheme" content="light dark">
        
        <meta name="robots" content="index, follow" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:creator" content="DamianS-eng" />
        <meta property="og:title" content="Game Boy Advance" />
        <meta property="og:site_name" content="Game Boy Advance" />
        <meta property="og:type" content='website' />
        <meta property="og:locale" content='en_US' />
        <meta property="og:description"
            content="A web app to play Game Boy Advance games" />
        <meta property="og:url" content="https://damians-eng.github.io/GBA-Emulator-Unblocked" />
        <meta property="og:image" content="https://damians-eng.github.io/GBA-Emulator-Unblocked/hero.webp" />
        <meta property="og:image-type" content="image/webp" />
        <meta property="og:image-height" content="1080" />
        <meta property="og:image-width" content="1920" />
        <meta property="og:image-alt" content="DamianS-eng" />
        
    </head>
    <body>
        <section id="top">
            <h1>Welcome to the GBA Emulator</h1>
            <img src="./Binaries/gba.png" alt="GBA Logo">
            <div>
                <label id='game-search-label'>
                    <span>Select a game:</span><br />
                    <input type='search' id='game-search' placeholder='Search for a game here'>
                </label>
            </div>
        </section>
        <main>
          <ul id='game-list'>
          </ul>
              <h3>Gameboy Game Collections</h3>
          <ul id='collections'>
              <li><a href="./launcher.html#pokemongb">The Pokemon Collection</a></li>
              <li><a href="./launcher.html#marioland">The Mario Land Collection</a></li>
          </ul>
              <h3>NES Game Collections</h3>
          <ul id='nes'>
              <li><a href="./launcher.html#nesgh1">NES Greatest Hits 1</a></li>
          </ul>
        </main>
        <footer>
          <h2>For Info On: Game Collections, Controls, And Some Other Cool Stuff. Check Out The Wiki: <a href="#" target="_blank"><img src="./Binaries/here.png" alt="here"></a></h2>
        </footer>
        <script>
            const binaryList = "./binary_list.json"
            let gamesList = [];
            const gameListEle = document.querySelector('#game-list');
            function insertGames(list) {
                const docfrag = document.createDocumentFragment();
                list.forEach((i) => {
                    //console.log(i);
                    const li = document.createElement('li');
                    li.classList.add('.game');
                    const anchor = document.createElement('a');
                    anchor.classList.add('game-name');
                    anchor.href = './launcher.html#' + i.filename;
                    anchor.innerText = (i.title === "") ? i.filename : i.title;
                    li.appendChild(anchor);
                    docfrag.appendChild(li);
                });
                return docfrag;
            };
            function getGamesList() {
                return fetch(binaryList)
                .then(res => {
                    if (!res.ok) {
                        throw new Error('HTTP error! status: ${res.status}');
                    }
                    return res.json();
                }).then(text => {
                    gamesList = text;
                    console.log(gamesList);
                    return gamesList;
                }).catch(err => {
                    console.error("Error loading JSON:", err);
                });
            }
            
            getGamesList().then(() => {
                if(gameListEle) {
                    gameListEle.appendChild(insertGames(gamesList));
                }
            });
            
            const searchEle = document.querySelector('#game-search');
            if (searchEle) {
                searchEle.addEventListener('input', function (e) {
                    const searchValue = searchEle.value;
                    const allGames = gamesListEle.querySelectorAll('.game');
                    allGames.forEach((i) => {
                        const nameEle = i.querySelector('.game-name');
                        i.style.display = 'none';
                        if (nameEle.innerText.toLowerCase().includes(searchValue.toLowerCase())) {
                            i.style.display = 'block';
                        }
                    })
                });
            }
        </script>
    </body>
    
</html>
